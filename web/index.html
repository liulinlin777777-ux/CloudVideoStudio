<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CloudVideoStudio · P0 timeline</title>
<style>body{margin:0;background:#10141c;color:#e8ebf2;font:15px system-ui}main{max-width:1050px;margin:36px auto;padding:20px}h1{font-size:27px}small{color:#9da9bc}video{width:640px;max-width:100%;background:black;border:1px solid #334155;border-radius:10px}section{background:#182131;padding:20px;border-radius:12px;margin:20px 0}button,input{font:inherit;border-radius:6px;padding:9px;margin:5px;background:#263650;color:white;border:1px solid #52637e}button{cursor:pointer}button:disabled{opacity:.5}.lane{display:flex;align-items:center;margin:10px 0}.label{width:100px}.rail{height:36px;position:relative;background:#0d1523;flex:1}.clip{position:absolute;height:28px;top:4px;box-sizing:border-box;border-radius:4px;background:#456bc3;padding:4px;font-size:12px;overflow:hidden}.audio .clip{background:#286e64}#status{white-space:pre-wrap;color:#92d6ad;min-height:45px}</style>
<main><small>P0 · SYNTHETIC MEDIA · CPU RENDERING</small><h1>CloudVideoStudio</h1><p>Multi-track technical baseline · 640 × 360 · 30000/1001 fps</p><video id="preview" controls preload="metadata" src="/media/render.mp4"></video><section><strong>Timeline · 120 frames</strong><div id="timeline"></div><label>PIP and audio cue start frame <input id="start" aria-label="PIP start frame" type="number" min="0" max="60" step="1"></label><div><button id="save">Save project</button><button id="load">Load saved project</button><button id="render">Render preview</button></div><p id="status" role="status">Loading project…</p></section><small>This prototype validates a bounded 2V/2A timeline. Professional workbench, Safari, 4K and GPU support remain unverified.</small></main>
<script>
let project;const $=id=>document.getElementById(id);function draw(){const tracks=project.sequences[0].tracks;$('timeline').replaceChildren();for(const t of tracks){const lane=document.createElement('div');lane.className='lane '+t.kind;const label=document.createElement('span');label.className='label';label.textContent=t.id;const rail=document.createElement('div');rail.className='rail';for(const c of t.clips){const clip=document.createElement('div');clip.className='clip';clip.style.left=(c.start_frame/120*100)+'%';clip.style.width=(c.duration_frames/120*100)+'%';clip.textContent=c.asset_id;rail.append(clip)}lane.append(label,rail);$('timeline').append(lane)}$('start').value=tracks[1].clips[0].start_frame}function apply(){const start=Number($('start').value);if(!Number.isInteger(start)||start<0||start>60)throw Error('Use an integer frame from 0 to 60');project.sequences[0].tracks[1].clips[0].start_frame=start;project.sequences[0].tracks[3].clips[0].start_frame=start;draw()}async function load(){const r=await fetch('/project');if(!r.ok)throw Error('Load failed');project=await r.json();draw();$('status').textContent='Project loaded · PIP start '+$('start').value+' frames'}async function post(url){apply();const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});const x=await r.json();if(!r.ok)throw Error(x.error);return x}$('start').onchange=()=>{try{apply();$('status').textContent='Timeline edited · save to persist'}catch(e){$('status').textContent=e.message}};$('save').onclick=async()=>{try{await post('/project');$('status').textContent='Project saved · PIP start '+$('start').value+' frames'}catch(e){$('status').textContent=e.message}};$('load').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('render').onclick=async()=>{const b=$('render');b.disabled=true;$('status').textContent='Rendering CPU preview…';try{const r=await post('/render');$('preview').src=r.url;$('preview').load();$('status').textContent='Render job '+r.status+' · '+r.output_bytes+' bytes · '+r.wall_seconds.toFixed(2)+'s'}catch(e){$('status').textContent='Render failed: '+e.message}finally{b.disabled=false}};load().catch(e=>$('status').textContent=e.message);
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CloudVideoStudio · P1 timeline</title>
<style>body{margin:0;background:#10141c;color:#e8ebf2;font:15px system-ui}main{max-width:1050px;margin:36px auto;padding:20px}h1{font-size:27px}small{color:#9da9bc}video{width:640px;max-width:100%;background:black;border:1px solid #334155;border-radius:10px}section{background:#182131;padding:20px;border-radius:12px;margin:20px 0}button,input{font:inherit;border-radius:6px;padding:9px;margin:5px;background:#263650;color:white;border:1px solid #52637e}button{cursor:pointer}button:disabled{opacity:.5}.lane{display:flex;align-items:center;margin:10px 0}.label{width:100px}.rail{height:36px;position:relative;background:#0d1523;flex:1}.clip{position:absolute;height:28px;top:4px;box-sizing:border-box;border-radius:4px;background:#456bc3;padding:4px;font-size:12px;overflow:hidden;white-space:nowrap}.audio .clip{background:#286e64}.clip.selected{outline:2px solid #f4ce68;z-index:1}.clip-choice{display:inline-block;margin:3px}#status{white-space:pre-wrap;color:#92d6ad;min-height:45px}#status.error{color:#ff9d9d}label{display:inline-block}</style>
<main><small>P1 · SYNTHETIC MEDIA · CPU RENDERING</small><h1>CloudVideoStudio</h1><p id="details">Loading timeline…</p><video id="preview" controls preload="metadata"></video><section><strong id="timeline-title">Timeline</strong><div id="timeline"></div><h3>Select a clip</h3><div id="clip-choices" role="group" aria-label="Timeline clips"></div><div><label>Start frame <input id="start" type="number" min="0" step="1"></label><label>Source in frame <input id="source-in" type="number" min="0" step="1"></label><label>Duration frames <input id="duration" type="number" min="1" step="1"></label></div><div><button id="move">Apply move</button><button id="trim">Apply trim</button></div><div><button id="save">Save project</button><button id="load">Load saved project</button><button id="render">Render preview</button></div><p id="status" role="status" aria-live="polite">Loading project…</p></section><small>This prototype validates a bounded 2V/2A timeline. Professional workbench, Safari, 4K and GPU support remain unverified.</small></main>
<script>
let project=null,selectedClip=null,dirty=false,busy=false;const $=id=>document.getElementById(id);const sequence=()=>project.sequences[0];
function clips(){return sequence().tracks.flatMap(track=>track.clips.map(clip=>({track,clip})));}
function totalFrames(){return Math.max(...clips().map(({clip})=>clip.start_frame+clip.duration_frames));}
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function setBusy(value){busy=value;for(const id of ['move','trim','save','load','render'])$(id).disabled=value}
function draw(){const seq=sequence(),total=totalFrames();$('details').textContent=`${seq.width} × ${seq.height} · ${seq.fps_num}/${seq.fps_den} fps · ${total} total frames`;$('timeline-title').textContent=`Timeline · ${total} frames`;$('timeline').replaceChildren();$('clip-choices').replaceChildren();for(const track of seq.tracks){const lane=document.createElement('div');lane.className='lane '+track.kind;const label=document.createElement('span');label.className='label';label.textContent=track.id;const rail=document.createElement('div');rail.className='rail';for(const clip of track.clips){const button=document.createElement('button');button.type='button';button.className='clip'+(clip.id===selectedClip?' selected':'');button.style.left=(clip.start_frame/total*100)+'%';button.style.width=Math.max(clip.duration_frames/total*100,1)+'%';button.textContent=clip.asset_id;button.title=`${clip.id}: start ${clip.start_frame}, source in ${clip.source_in_frame}, duration ${clip.duration_frames}`;button.setAttribute('aria-label',`Select ${track.id} clip ${clip.id}`);button.setAttribute('aria-pressed',String(clip.id===selectedClip));button.onclick=()=>select(clip.id);rail.append(button);const choice=document.createElement('button');choice.type='button';choice.className='clip-choice';choice.textContent=`${track.id} · ${clip.id}`;choice.setAttribute('aria-pressed',String(clip.id===selectedClip));choice.onclick=()=>select(clip.id);$('clip-choices').append(choice)}lane.append(label,rail);$('timeline').append(lane)}$('start').max='300';const found=clips().find(item=>item.clip.id===selectedClip);if(found){const asset=project.assets.find(item=>item.id===found.clip.asset_id);$('start').value=found.clip.start_frame;$('source-in').value=found.clip.source_in_frame;$('duration').value=found.clip.duration_frames;$('source-in').max=String(asset.duration_frames-1);$('duration').max=String(asset.duration_frames-found.clip.source_in_frame)}status(dirty?'Edited in memory · save to persist':'Project loaded · no unsaved edits')}
function select(id){selectedClip=id;draw()}
function integerInput(id,positive=false){const field=$(id),value=field.valueAsNumber;if(!Number.isInteger(value)||value<(positive?1:0))throw Error(`${field.labels[0].textContent.trim()} must be a ${positive?'positive ':' '}integer`);return value}
async function request(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let result;try{result=await response.json()}catch{throw Error(`Server returned HTTP ${response.status}`)}if(!response.ok)throw Error(result.error||`HTTP ${response.status}`);return result}
async function apply(operation){if(busy||!project)return;try{const selected=clips().find(item=>item.clip.id===selectedClip);if(!selected)throw Error('Select a clip first');let body={project,operation,clip_id:selectedClip};if(operation==='move')body.start_frame=integerInput('start');else{body.source_in_frame=integerInput('source-in');body.duration_frames=integerInput('duration',true)}setBusy(true);status(`Applying ${operation}…`);const result=await request('/edit',body);project=result.project;dirty=true;draw()}catch(error){status(`Edit failed: ${error.message}`,true)}finally{setBusy(false)}}
async function load(){if(busy)return;setBusy(true);status('Loading saved project…');try{const response=await fetch('/project');let result;try{result=await response.json()}catch{throw Error(`Server returned HTTP ${response.status}`)}if(!response.ok)throw Error(result.error||`HTTP ${response.status}`);project=result;selectedClip=clips()[0]?.clip.id||null;dirty=false;draw()}catch(error){status(`Load failed: ${error.message}`,true)}finally{setBusy(false)}}
$('move').onclick=()=>apply('move');$('trim').onclick=()=>apply('trim');$('save').onclick=async()=>{if(busy||!project)return;setBusy(true);status('Saving current project…');try{const result=await request('/project',project);project=result.project;dirty=false;draw();status('Current project saved.')}catch(error){status(`Save failed: ${error.message}`,true)}finally{setBusy(false)}};$('load').onclick=load;$('render').onclick=async()=>{if(busy||!project)return;setBusy(true);status('Rendering current project on CPU…');try{const result=await request('/render',project);$('preview').src=result.url;$('preview').load();status(`Render ${result.status} · ${result.output_bytes} bytes · ${result.wall_seconds.toFixed(2)}s wall · ${result.cpu_seconds.toFixed(2)}s CPU · ${result.fps} fps · ${result.duration_frames} frames${dirty?' · edits remain unsaved':''}`)}catch(error){status(`Render failed: ${error.message}`,true)}finally{setBusy(false)}};load();
</script></html>
